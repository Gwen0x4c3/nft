global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # NFT Platform HTTP Server
  - job_name: 'nft-server'
    static_configs:
      - targets: ['nft-server:8080']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # NFT Platform gRPC Server
  - job_name: 'nft-grpc-server'
    static_configs:
      - targets: ['nft-grpc-server:9000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Kafka
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    scrape_interval: 30s