syntax = "proto3";

package user;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nft-platform/proto/user";

// User service for managing user accounts and authentication
service UserService {
  // Authentication methods
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  
  // User management methods
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc GetUserByWallet(GetUserByWalletRequest) returns (GetUserResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
}

// Messages for authentication
message LoginRequest {
  string wallet_address = 1;
  string signature = 2;
  string message = 3;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  User user = 4;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string wallet_address = 3;
  string signature = 4;
  string message = 5;
  string avatar = 6;
  string bio = 7;
}

message RegisterResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  User user = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  uint32 user_id = 2;
  string wallet_address = 3;
}

// Messages for user management
message GetUserRequest {
  uint32 user_id = 1;
}

message GetUserByWalletRequest {
  string wallet_address = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  uint32 user_id = 1;
  string username = 2;
  string avatar = 3;
  string bio = 4;
}

message UpdateUserResponse {
  User user = 1;
}

message GetUsersRequest {
  repeated uint32 user_ids = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetUsersResponse {
  repeated User users = 1;
  Pagination pagination = 2;
}

// User entity
message User {
  uint32 id = 1;
  string username = 2;
  string email = 3;
  string wallet_address = 4;
  string avatar = 5;
  string bio = 6;
  bool is_verified = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// Common pagination message
message Pagination {
  int32 page = 1;
  int32 limit = 2;
  int32 total = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_prev = 6;
}
